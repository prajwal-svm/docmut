name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: CLI smoke
        run: node dist/cli.js --list-operators | head -20
      - name: Operator manifest
        run: pnpm adequacy --manifest-only --out evidence/operator-manifest.json
      - name: Manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-manifest-node-${{ matrix.node-version }}
          path: evidence/operator-manifest.json
